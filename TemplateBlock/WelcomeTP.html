{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyFlow | Get into the flow</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0c; /* Глибокий темний фон */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Щоб не було скролу на вітальному екрані */
        }
        
        /* Глобальні стилі для React-контейнера */
        #root {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, rgba(30, 40, 60, 0.4), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(20, 10, 40, 0.4), transparent 40%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="{% static 'React/WelcomeRP.js' %}"></script>

</html>
